plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// JediTerm (JetBrains' terminal emulator core) is published only here.
	maven {
		name = 'IntelliJ Dependencies'
		url = 'https://packages.jetbrains.team/maven/p/ij/intellij-dependencies'
		content { includeGroup 'org.jetbrains.jediterm' }
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcterm" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mcterm-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Terminal emulator (no AWT in -core) + native pseudo-terminal.
	// JNA and SLF4J are already on Minecraft's classpath, so they are not bundled.
	implementation("org.jetbrains.jediterm:jediterm-core:${project.jediterm_version}") { transitive = false }
	implementation("org.jetbrains.pty4j:pty4j:${project.pty4j_version}") { transitive = false }
	implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"
	include "org.jetbrains.jediterm:jediterm-core:${project.jediterm_version}"
	include "org.jetbrains.pty4j:pty4j:${project.pty4j_version}"
	include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"
	compileOnly "org.jetbrains:annotations:26.1.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The installer: install.sh with this release's versions, URLs and SHA-512 hashes filled in.
tasks.register('installer') {
	group = 'distribution'
	description = 'Builds build/distributions/install.sh for the GitHub release'
	dependsOn tasks.named('jar')
	def modJar = tasks.named('jar').flatMap { it.archiveFile }
	def template = file('install.sh')
	def out = layout.buildDirectory.file('distributions/install.sh')
	def mcVersion = project.minecraft_version
	def loaderVersion = project.loader_version
	def fabricApiVersion = project.fabric_api_version
	def modVersion = project.version
	inputs.file template
	inputs.file modJar
	inputs.property 'fabricApiVersion', fabricApiVersion
	outputs.file out

	doLast {
		def query = URLEncoder.encode("[\"${mcVersion}\"]", 'UTF-8')
		def versions = new groovy.json.JsonSlurper().parse(
				new URL("https://api.modrinth.com/v2/project/fabric-api/version?game_versions=${query}"))
		def api = versions.find { it.version_number == fabricApiVersion }
		if (api == null) throw new GradleException("Fabric API ${fabricApiVersion} is not on Modrinth")
		def apiFile = api.files.find { it.primary } ?: api.files[0]
		def jar = modJar.get().asFile
		def sha = java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes).encodeHex().toString()
		def text = template.text
				.replace('@MC_VERSION@', mcVersion)
				.replace('@LOADER_VERSION@', loaderVersion)
				.replace('@MOD_URL@', "https://github.com/pronnmark/minecraft-terminal/releases/download/v${modVersion}/${jar.name}")
				.replace('@MOD_SHA512@', sha)
				.replace('@API_URL@', apiFile.url)
				.replace('@API_SHA512@', apiFile.hashes.sha512)
		if (text =~ /@[A-Z0-9_]+@/) throw new GradleException('install.sh has an unfilled @PLACEHOLDER@')
		def f = out.get().asFile
		f.parentFile.mkdirs()
		f.text = text
		f.setExecutable(true)
	}
}
