plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// JediTerm (JetBrains' terminal emulator core) is published only here.
	maven {
		name = 'IntelliJ Dependencies'
		url = 'https://packages.jetbrains.team/maven/p/ij/intellij-dependencies'
		content { includeGroup 'org.jetbrains.jediterm' }
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcterm" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mcterm-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Terminal emulator (no AWT in -core) + native pseudo-terminal.
	// JNA and SLF4J are already on Minecraft's classpath, so they are not bundled.
	implementation("org.jetbrains.jediterm:jediterm-core:${project.jediterm_version}") { transitive = false }
	implementation("org.jetbrains.pty4j:pty4j:${project.pty4j_version}") { transitive = false }
	implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"
	include "org.jetbrains.jediterm:jediterm-core:${project.jediterm_version}"
	include "org.jetbrains.pty4j:pty4j:${project.pty4j_version}"
	include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"
	compileOnly "org.jetbrains:annotations:26.1.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// One-file install: a Modrinth modpack. Open it with the Modrinth App (or Prism Launcher) and it
// creates a ready Minecraft + Fabric instance with Fabric API (downloaded from Modrinth) and this mod.
tasks.register('mrpack', Zip) {
	group = 'distribution'
	description = 'Builds build/distributions/minecraft-terminal-<version>.mrpack'
	dependsOn tasks.named('jar')
	def modJar = tasks.named('jar').flatMap { it.archiveFile }
	def mcVersion = project.minecraft_version
	def loaderVersion = project.loader_version
	def fabricApiVersion = project.fabric_api_version
	def packVersion = project.version
	def index = layout.buildDirectory.file('mrpack/modrinth.index.json')
	inputs.property 'fabricApiVersion', fabricApiVersion
	inputs.property 'loaderVersion', loaderVersion

	archiveFileName = "minecraft-terminal-${packVersion}.mrpack"
	destinationDirectory = layout.buildDirectory.dir('distributions')

	doFirst {
		def query = URLEncoder.encode("[\"${mcVersion}\"]", 'UTF-8')
		def versions = new groovy.json.JsonSlurper().parse(
				new URL("https://api.modrinth.com/v2/project/fabric-api/version?game_versions=${query}"))
		def api = versions.find { it.version_number == fabricApiVersion }
		if (api == null) throw new GradleException("Fabric API ${fabricApiVersion} is not on Modrinth")
		def file = api.files.find { it.primary } ?: api.files[0]
		def json = [
				formatVersion: 1,
				game         : 'minecraft',
				versionId    : packVersion,
				name         : 'Minecraft Terminal',
				summary      : 'A real terminal inside Minecraft. Press K, or right-click a [pc] sign.',
				files        : [[
						path     : "mods/${file.filename}",
						hashes   : [sha1: file.hashes.sha1, sha512: file.hashes.sha512],
						env      : [client: 'required', server: 'unsupported'],
						downloads: [file.url],
						fileSize : file.size,
				]],
				dependencies : [minecraft: mcVersion, 'fabric-loader': loaderVersion],
		]
		def out = index.get().asFile
		out.parentFile.mkdirs()
		out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
	}
	from(index)
	// Our own mod is not on Modrinth, so it ships inside the pack.
	from(modJar) { into 'overrides/mods' }
}
